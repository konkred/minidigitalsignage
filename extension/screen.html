<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Signage</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            align-items: center;
            background: #111418;
            color: #e9ecef;
            cursor: none;
            display: flex;
            font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }
        body.blank { background: #000; }
        main { max-width: 92vw; }
        #label { color: #adb5bd; font-size: 3vh; margin: 0 0 2vh; }
        #code {
            font-family: ui-monospace, Consolas, "DejaVu Sans Mono", monospace;
            font-size: 18vh;
            font-weight: 600;
            letter-spacing: .05em;
            line-height: 1.1;
            margin: 0;
        }
        #title { font-size: 6vh; font-weight: 500; margin: 0; }
        #message {
            font-weight: 600;
            line-height: 1.15;
            margin: 0;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        #hint { color: #adb5bd; font-size: 2.5vh; margin: 3vh 0 0; }
        [hidden] { display: none; }
    </style>
</head>
<body>
    <main>
        <p id="label" hidden>Registriercode</p>
        <p id="code" hidden></p>
        <h1 id="title" hidden></h1>
        <p id="message" hidden></p>
        <p id="hint"></p>
    </main>
    <script src="screen.js"></script>
</body>
</html>
